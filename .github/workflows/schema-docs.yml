name: Update Schema Docs

on:
  pull_request:
    branches: [main]
    paths:
      - "fastapi_code_generator/config.py"
      - "fastapi_code_generator/_types/**"
      - "tests/data/openapi/**"
      - "scripts/build_schema_docs.py"
      - "docs/supported_formats.md"
      - "tox.ini"
      - "pyproject.toml"
      - ".github/workflows/schema-docs.yml"

permissions:
  contents: read

jobs:
  update-schema-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          persist-credentials: false
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          python-version: "3.14"
      - name: Install tox
        run: uv tool install --python 3.14 tox --with tox-uv
      - name: Setup environment
        run: tox run -vv --notest --skip-missing-interpreters false -e schema-docs
        env:
          UV_PYTHON_PREFERENCE: "only-managed"
      - name: Build schema docs
        run: .tox/schema-docs/bin/python scripts/build_schema_docs.py --check
