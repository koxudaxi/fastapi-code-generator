name: Docs Deploy

on:
  workflow_call:
    inputs:
      checkout_ref:
        required: true
        type: string
      deploy_branch:
        required: false
        type: string
        default: ""
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false

jobs:
  build-deploy:
    runs-on: ubuntu-24.04
    concurrency:
      group: docs-deploy-${{ inputs.deploy_branch || inputs.checkout_ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --frozen --group docs
      - name: Copy CHANGELOG to docs
        run: |
          if [ -f CHANGELOG.md ]; then
            cp CHANGELOG.md docs/changelog.md
          else
            echo "# Changelog" > docs/changelog.md
            echo "" >> docs/changelog.md
            echo "Changelog will be available after the first release." >> docs/changelog.md
          fi
      - name: Update GitHub Action version in docs
        run: uv run python scripts/update_docs_version.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build site
        run: uv run zensical build --clean
      - name: Deploy
        if: inputs.deploy_branch != ''
        env:
          DEPLOY_BRANCH: ${{ inputs.deploy_branch }}
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=fastapi-code-generator --branch="$DEPLOY_BRANCH"
